spring:
  application:
    name: confluence-publisher
  
  datasource:
    url: ${DATABASE_URL:jdbc:sqlite:./data/app.db}
    driver-class-name: org.sqlite.JDBC
  
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        format_sql: true
    show-sql: false
  
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

confluence:
  url: ${CONFLUENCE_URL:}
  username: ${CONFLUENCE_USERNAME:}
  api-token: ${CONFLUENCE_API_TOKEN:}
  default-space: ${CONFLUENCE_DEFAULT_SPACE:}
  provider-type: ${CONFLUENCE_PROVIDER_TYPE:confluence-stub}

storage:
  attachments-dir: ${ATTACHMENTS_DIR:storage/attachments}

cors:
  allowed-origins:
    - http://localhost:4200
    - http://localhost:8080
    - http://localhost:5173

scheduler:
  interval-seconds: ${SCHEDULER_INTERVAL_SECONDS:60}
